<main class="dashboard">
  <lam-global-header [userType]="userType" (loggedOut)="loggedOut.emit()" />

  <div class="dashboard__body">
    <lam-side-navigation *ngIf="navigation.isSidebarOpen()" (newLeadRequested)="newLeadRequested.emit()" />

    <button
      *ngIf="navigation.isSidebarOpen() && !isDesktopViewport"
      type="button"
      class="sidebar-backdrop"
      aria-label="Close navigation"
      (click)="closeSidebarFromOverlay()"
    ></button>

    <section class="priorities" aria-label="Lead priorities">
      <div class="filters" role="search">
        <app-search-field class="filters__search" name="lead-search" placeholder="Search by lead name or ID" ariaLabel="Search by lead name or ID" [(value)]="searchTerm" />
        <tdx-field-control
          name="lead-source"
          ariaLabel="Source of lead"
          [selectedValues]="pendingSources"
          [options]="sourceControlOptions"
          trailingIcon="keyboard_arrow_down"
          [width]="112"
          [menuWidth]="250"
          [menuFitContent]="true"
          [multiple]="true"
          allValue="All"
          allLabel="All Sources"
          [showMenuActions]="true"
          [resetDisabled]="!sourceSelectionHasValues"
          [applyDisabled]="!sourceSelectionDirty"
          (openChange)="handleSourceMenuOpen($event)"
          (selectedValuesChange)="pendingSources = $event"
          (resetRequested)="resetPendingSources()"
          (applyRequested)="applySources()"
        />
        <div
          class="filters__filter"
          [class.filters__filter--active]="filterHasAppliedValues"
          (click)="$event.stopPropagation()"
        >
          <tdx-field-control label="Filter" ariaLabel="Filter leads" leadingIcon="filter_alt" [width]="76" (activated)="toggleFilterMenu()" />
          <span *ngIf="filterHasAppliedValues" class="visually-hidden" aria-live="polite">Active filters applied</span>

          <section *ngIf="filterMenuOpen" class="page-filter" aria-label="Filter leads">
            <div class="page-filter__field">
              <span>Lead States</span>
              <tdx-field-control
                name="lead-states"
                ariaLabel="Filter by Lead States"
                [selectedValues]="pendingLeadStates"
                [options]="leadStateControlOptions"
                trailingIcon="keyboard_arrow_down"
                [width]="144"
                [menuWidth]="204"
                [compact]="true"
                [multiple]="true"
                [menuFitContent]="true"
                (selectedValuesChange)="pendingLeadStates = $event"
              />
            </div>
            <div class="page-filter__field">
              <span>Lead Status</span>
              <tdx-field-control
                name="lead-statuses"
                ariaLabel="Filter by Lead Status"
                [selectedValues]="pendingLeadStatuses"
                [options]="leadStatusControlOptions"
                trailingIcon="keyboard_arrow_down"
                [width]="144"
                [menuWidth]="204"
                [compact]="true"
                [multiple]="true"
                [menuFitContent]="true"
                (selectedValuesChange)="pendingLeadStatuses = $event"
              />
            </div>
            <div class="page-filter__field page-filter__field--referrer">
              <span>Referrer</span>
              <div class="page-filter__referrer">
                <app-search-field
                  name="referrer-search"
                  placeholder="Search referrer"
                  ariaLabel="Search referrer"
                  [compact]="true"
                  [value]="referrerSearchTerm"
                  (focused)="openReferrerSuggestions()"
                  (valueChange)="updateReferrerSearch($event)"
                />
                <div
                  *ngIf="referrerSuggestionsOpen && filteredReferrerOptions.length"
                  class="page-filter__referrer-options"
                  role="listbox"
                  aria-label="Referrer suggestions"
                >
                  <button
                    *ngFor="let referrer of filteredReferrerOptions"
                    type="button"
                    role="option"
                    [attr.aria-selected]="pendingReferrer === referrer"
                    (click)="selectReferrer(referrer); $event.stopPropagation()"
                  >{{ referrer }}</button>
                </div>
                <div *ngIf="hasNoReferrerResults" class="page-filter__referrer-options page-filter__referrer-options--empty" role="status">
                  No results found
                </div>
              </div>
            </div>
            <fieldset>
              <legend>Sort by</legend>
              <app-radio
                *ngFor="let option of sortOptions"
                name="page-sort"
                [label]="option.label"
                [value]="option.value"
                [checked]="pendingSort === option.value"
                (changed)="pendingSort = $event"
              />
            </fieldset>
            <footer>
              <app-button label="Reset" [variant]="buttonVariant.Subtle" [size]="buttonSize.Small" [disabled]="!filterHasValues" (clicked)="resetPendingFilters()" />
              <app-button label="Apply" [variant]="buttonVariant.Primary" [size]="buttonSize.Small" [disabled]="!filterDirty" (clicked)="applyFilters()" />
            </footer>
          </section>
        </div>
      </div>

      <div class="board-viewport" tabindex="0" aria-label="Lead pipeline boards">
        <div class="board-track">
          <lam-lead-board
            *ngFor="let board of filteredBoards; trackBy: trackBoard"
            [board]="board"
            [highlightedLeadId]="highlightedLeadId"
            (leadSelected)="selectLead($event)"
          />
        </div>
      </div>
    </section>
  </div>

  <p class="selection-announcement visually-hidden" aria-live="polite">
    {{ selectedLead ? selectedLead.name + ' selected' : '' }}
  </p>
</main>
