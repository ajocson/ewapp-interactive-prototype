name: Deploy Angular app to GitHub Pages

on:
  push:
    branches:
      - main
      - feature/proposal-revamp
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main
          path: main-source

      - name: Check out proposal preview branch
        uses: actions/checkout@v6
        with:
          ref: feature/proposal-revamp
          path: preview-source

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            main-source/package-lock.json
            preview-source/package-lock.json

      - name: Install dependencies
        working-directory: main-source
        run: npm ci

      - name: Install preview dependencies
        working-directory: preview-source
        run: npm ci

      - name: Build main application
        working-directory: main-source
        run: npm run build -- --configuration production --base-href /ewapp-interactive-prototype/

      - name: Build proposal preview application
        working-directory: preview-source
        run: npm run build -- --configuration production --base-href /ewapp-interactive-prototype/proposal-revamp/

      - name: Assemble GitHub Pages site
        run: |
          mkdir -p site/proposal-revamp
          cp -R main-source/dist/ewapp-interactive-prototype/browser/. site/
          cp -R preview-source/dist/ewapp-interactive-prototype/browser/. site/proposal-revamp/
          node <<'NODE'
          const fs = require('node:fs');
          const indexFiles = [
            'site/index.html',
            'site/proposal-revamp/index.html',
          ];
          const restoreScript = '    <script src="/ewapp-interactive-prototype/pages-route-restore.js"></script>\n';

          for (const file of indexFiles) {
            const html = fs.readFileSync(file, 'utf8');
            if (!html.includes('</head>')) {
              throw new Error(`Could not find </head> in ${file}`);
            }
            fs.writeFileSync(file, html.replace('</head>', `${restoreScript}  </head>`));
          }
          NODE
          cp preview-source/.github/pages-route-restore.js site/pages-route-restore.js
          cp preview-source/.github/pages-404.html site/404.html
          cp preview-source/.github/pages-404.html site/proposal-revamp/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
