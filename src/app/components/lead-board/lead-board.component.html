<section
  class="lead-board"
  [class.lead-board--filter-open]="isFilterOpen"
  [attr.aria-labelledby]="board.id + '-title'"
>
  <header class="lead-board__header">
    <span *ngIf="!isSearchOpen" class="lead-board__heading">
      <h2 [id]="board.id + '-title'">{{ board.title }}</h2>
      <span class="lead-board__count" [attr.aria-label]="board.leads.length + ' leads'">
        {{ board.leads.length }}
      </span>
    </span>

    <h2 *ngIf="isSearchOpen" [id]="board.id + '-title'" class="visually-hidden">{{ board.title }}</h2>

    <label *ngIf="isSearchOpen" class="lead-board__search-field">
      <span class="visually-hidden">Search {{ board.title }} leads</span>
      <input
        #searchInput
        type="search"
        placeholder="Search"
        [value]="searchTerm"
        (input)="updateSearch($any($event.target).value)"
      >
    </label>

    <span class="lead-board__actions">
      <lam-icon-button
        *ngIf="!isSearchOpen"
        icon="search"
        [label]="'Search ' + board.title"
        tooltip="Search"
        tooltipPosition="bottom"
        [disabled]="board.leads.length === 0"
        (activated)="openSearch()"
      />
      <lam-icon-button
        *ngIf="isSearchOpen"
        icon="cancel"
        [label]="'Close search for ' + board.title"
        tooltip="Close search"
        tooltipPosition="bottom"
        (activated)="closeSearch()"
      />
      <span class="lead-board__filter-control" [class.lead-board__filter-control--active]="hasAppliedFilters">
        <lam-icon-button
          icon="sort"
          [label]="'Filter & Sort ' + board.title"
          tooltip="Filter & Sort"
          tooltipPosition="bottom"
          tooltipAlign="end"
          [disabled]="board.leads.length === 0"
          (activated)="toggleFilterMenu()"
        />
      </span>
    </span>
  </header>

  <div class="lead-board__cards">
    <lam-lead-card
      *ngFor="let lead of visibleLeads; trackBy: trackLead"
      [lead]="lead"
      [highlighted]="lead.id === highlightedLeadId"
      [showTatAging]="board.id !== 'lead'"
      (selected)="leadSelected.emit($event)"
    />
  </div>

  <form
    *ngIf="isFilterOpen"
    class="lead-board__filter-menu"
    aria-label="Filter and sort leads"
    (submit)="$event.preventDefault(); applyFilters()"
  >
    <label class="lead-board__state-filter">
      <span>Filter by Lead State</span>
      <app-field-control
        ariaLabel="Filter by Lead State"
        [name]="board.id + '-lead-state-filter'"
        [fluid]="true"
        [compact]="true"
        [multiple]="true"
        [options]="leadStateOptions"
        [selectedValues]="draftFilters.leadStates.length ? draftFilters.leadStates : ['All']"
        trailingIcon="keyboard_arrow_down"
        (selectedValuesChange)="updateLeadStates($event)"
      />
    </label>

    <fieldset>
      <legend>Sort by</legend>
      <label *ngFor="let option of availableSortOptions" class="lead-board__radio">
        <input
          type="radio"
          [name]="board.id + '-sort-filter'"
          [checked]="draftFilters.sort === option.value"
          (change)="toggleSort(option.value)"
        >
        <span>{{ option.label }}</span>
      </label>
    </fieldset>

    <div class="lead-board__filter-actions">
      <app-button label="Reset" [variant]="buttonVariant.Subtle" [size]="buttonSize.Small" [disabled]="!hasDraftFilters" (clicked)="clearDraftFilters()" />
      <app-button label="Apply" [variant]="buttonVariant.Primary" [size]="buttonSize.Small" [disabled]="!canApplyFilters" (clicked)="applyFilters()" />
    </div>
  </form>
</section>
