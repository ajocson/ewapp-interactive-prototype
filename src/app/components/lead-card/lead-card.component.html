<button type="button" class="lead-card" [class.lead-card--highlighted]="highlighted" (click)="selected.emit(lead)">
  <span class="lead-card__identity">
    <small class="lead-card__id">{{ lead.leadId }}</small>
    <strong>{{ displayName }}</strong>
    <small>{{ lead.createdAt }}</small>
  </span>

  <span class="lead-card__tags" *ngIf="visibleTags.length">
    <app-tag
      *ngFor="let tag of visibleTags; trackBy: trackTag"
      [label]="tag.label"
      [variant]="tagVariant(tag.tone)"
      [emphasis]="TdxTagEmphasis.Subtle"
    />
  </span>

  <span class="lead-card__metadata">
    <span [class.lead-card__state--danger]="lead.leadType === 'Dropped'"><span class="material-symbols-rounded" aria-hidden="true">person</span>{{ lead.leadType }}</span>
    <span class="lead-card__aging-group">
      <span
        class="lead-card__aging lead-card__aging--overall"
        aria-label="Overall aging: {{ lead.aging }}. Total days since Lead Generation."
      >
        <span class="material-symbols-rounded" aria-hidden="true">schedule</span>
        <span aria-hidden="true">{{ lead.aging }}</span>
        <span class="lead-card__tooltip" aria-hidden="true">Total days since Lead Generation.</span>
      </span>
      <span
        *ngIf="showTatAging && lead.tatAging"
        class="lead-card__aging lead-card__aging--tat"
        aria-label="TAT aging: {{ lead.tatAging }}. Days elapsed in the 90-day Active Lead cycle."
      >
        <span class="material-symbols-rounded" aria-hidden="true">flag_2</span>
        <span aria-hidden="true">{{ lead.tatAging }}</span>
        <span class="lead-card__tooltip" aria-hidden="true">Days elapsed in the 90-day Active Lead cycle.</span>
      </span>
    </span>
  </span>
</button>
