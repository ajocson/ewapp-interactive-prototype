<div
  #controlRoot
  class="tdx-field-control"
  [class.tdx-field-control--disabled]="disabled"
  [class.tdx-field-control--open]="isOpen"
  [class.tdx-field-control--compact]="compact"
  [class.tdx-field-control--fluid]="fluid"
  [style.width.px]="fluid ? null : width"
>
  <button
    *ngIf="options.length; else actionControl"
    type="button"
    class="tdx-field-control__trigger"
    [disabled]="disabled"
    [attr.aria-label]="ariaLabel || label"
    aria-haspopup="listbox"
    [attr.aria-expanded]="isOpen"
    (click)="toggleOptions($event)"
  >
    <span *ngIf="leadingIcon" class="material-symbols-rounded" aria-hidden="true">{{ leadingIcon }}</span>
    <span class="tdx-field-control__value">{{ displayValue }}</span>
    <span *ngIf="trailingIcon" class="material-symbols-rounded tdx-field-control__trailing" aria-hidden="true">{{ trailingIcon }}</span>
  </button>

  <ng-template #actionControl>
    <button type="button" class="tdx-field-control__trigger" [disabled]="disabled" [attr.aria-label]="ariaLabel || label" (click)="activate($event)">
      <span *ngIf="leadingIcon" class="material-symbols-rounded" aria-hidden="true">{{ leadingIcon }}</span>
      <span class="tdx-field-control__value">{{ label }}</span>
      <span *ngIf="trailingIcon" class="material-symbols-rounded tdx-field-control__trailing" aria-hidden="true">{{ trailingIcon }}</span>
    </button>
  </ng-template>

  <div
    #optionsMenu
    *ngIf="options.length && isOpen"
    class="tdx-field-control__menu"
    [class.tdx-field-control__menu--checkboxes]="multiple"
    [class.tdx-field-control__menu--fit-content]="menuFitContent"
    role="listbox"
    [attr.aria-multiselectable]="multiple || null"
    [style.left.px]="menuPosition?.left"
    [style.top.px]="menuPosition?.top"
    [style.width.px]="menuPosition?.width ?? (fluid || menuFitContent ? null : menuWidth)"
    [style.max-height.px]="menuPosition?.maxHeight"
    [attr.aria-label]="ariaLabel || label"
    (click)="$event.stopPropagation()"
  >
    <ng-container *ngFor="let option of options">
      <label *ngIf="multiple; else singleOption" class="tdx-field-control__checkbox-option" role="option" [class.is-selected]="isSelected(option.value)" [attr.aria-selected]="isSelected(option.value)">
        <input type="checkbox" [name]="name" [value]="option.value" [checked]="isSelected(option.value)" (change)="toggleValue(option.value)">
        <span>{{ option.label }}</span>
      </label>
      <ng-template #singleOption>
        <button
          type="button"
          role="option"
          [class.is-selected]="isSelected(option.value)"
          [attr.aria-selected]="isSelected(option.value)"
          (click)="updateValue(option.value)"
        >{{ option.label }}</button>
      </ng-template>
    </ng-container>
    <footer *ngIf="multiple && showMenuActions" class="tdx-field-control__menu-actions">
      <app-button
        label="Reset"
        [variant]="buttonVariant.Subtle"
        [size]="buttonSize.Small"
        [disabled]="resetDisabled"
        (clicked)="requestReset($event)"
      />
      <app-button
        label="Apply"
        [variant]="buttonVariant.Primary"
        [size]="buttonSize.Small"
        [disabled]="applyDisabled"
        (clicked)="requestApply($event)"
      />
    </footer>
  </div>
</div>
