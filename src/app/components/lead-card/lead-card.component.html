<button type="button" class="lead-card" [class.lead-card--highlighted]="highlighted" (click)="selected.emit(lead)">
  <span class="lead-card__identity">
    <strong>{{ displayName }}</strong>
    <small>{{ lead.createdAt }}</small>
  </span>

  <span class="lead-card__tags" *ngIf="visibleTags.length">
    <app-tag
      *ngFor="let tag of visibleTags; trackBy: trackTag"
      [label]="tag.label"
      [variant]="tagVariant(tag.tone)"
      [emphasis]="TdxTagEmphasis.Subtle"
    />
  </span>

  <span class="lead-card__metadata">
    <span [class.lead-card__state--danger]="lead.leadType === 'Dropped'"><span class="material-symbols-rounded" aria-hidden="true">person</span>{{ lead.leadType }}</span>
    <span><span class="material-symbols-rounded" aria-hidden="true">schedule</span>{{ lead.aging }}</span>
  </span>
</button>
