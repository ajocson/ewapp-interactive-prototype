<button type="button" class="lead-card" [class.lead-card--highlighted]="highlighted" [class.lead-card--not-contacted-48-hours]="lead.notContactedFor48Hours" (click)="selected.emit(lead)">
  <span class="lead-card__identity">
    <small class="lead-card__id">{{ lead.leadId }}</small>
    <strong>{{ displayName }}</strong>
    <small>{{ lead.createdAt }}</small>
  </span>

  <span *ngIf="lead.notContactedFor48Hours" class="lead-card__contact-alert" aria-label="Not contacted within 48 hours">
    <span class="material-symbols-rounded" aria-hidden="true">person_alert</span>
  </span>

  <span *ngIf="lead.notContactedFor30Days" class="lead-card__contact-alert lead-card__contact-alert--error" aria-label="Not contacted within 30 days">
    <span class="material-symbols-rounded" aria-hidden="true">person_cancel</span>
  </span>

  <span *ngIf="lead.autoDroppedAfter90Days" class="lead-card__contact-alert lead-card__contact-alert--neutral" aria-label="Auto-dropped after 90 days without progress">
    <span class="material-symbols-rounded" aria-hidden="true">person_off</span>
  </span>

  <span *ngIf="lead.autoParkedAfter30Days" class="lead-card__auto-parked-indicator" aria-label="Auto-parked after 30 days without an appointment">
    <span class="material-symbols-rounded" aria-hidden="true">person_alert</span>
  </span>

  <span class="lead-card__tags" *ngIf="visibleTags.length">
    <app-tag
      *ngFor="let tag of visibleTags; trackBy: trackTag"
      [label]="tag.label"
      [variant]="tagVariant(tag.tone)"
      [emphasis]="TdxTagEmphasis.Subtle"
    />
  </span>

  <span class="lead-card__metadata">
    <span [class.lead-card__state--danger]="lead.leadType === 'Dropped'"><span class="material-symbols-rounded" aria-hidden="true">person</span>{{ lead.leadType }}</span>
    <span class="lead-card__aging-group">
      <span
        class="lead-card__aging lead-card__aging--overall"
        aria-label="Overall aging: {{ lead.aging }}. Total days since Lead Generation."
        (mouseenter)="showAgingTooltip($event, 'Total days since Lead Generation.')"
        (mouseleave)="hideAgingTooltip()"
      >
        <span class="material-symbols-rounded" aria-hidden="true">schedule</span>
        <span aria-hidden="true">{{ lead.aging }}</span>
      </span>
      <span
        *ngIf="showTatAging && lead.tatAging"
        class="lead-card__aging lead-card__aging--tat"
        aria-label="TAT aging: {{ lead.tatAging }}. Days elapsed in the 90-day Active Lead cycle."
        (mouseenter)="showAgingTooltip($event, 'Days elapsed in the 90-day Active Lead cycle.')"
        (mouseleave)="hideAgingTooltip()"
      >
        <span class="material-symbols-rounded" aria-hidden="true">flag_2</span>
        <span aria-hidden="true">{{ lead.tatAging }}</span>
      </span>
    </span>
  </span>
</button>
